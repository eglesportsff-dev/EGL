services:
  db:
    image: postgres:15
    container_name: tournament_db
    environment:
      POSTGRES_DB: esports_tournament
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: tournament_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tournament_backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/esports_tournament
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-EliteGrindLeagueTournamentSecureJwtSecretKey2026SpringBootAuthenticationSystem}
      JWT_EXPIRATION_MINUTES: 1440
      FRONTEND_ORIGIN: http://localhost
      OTP_TTL_MINUTES: 10
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-lavkush01maurya@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Lav#2004}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Lavkush}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: tournament_frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    container_name: tournament_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        # frontend doesn't have healthcheck, so depend on start
        condition: service_started

volumes:
  db_data:
