<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="lwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D08" />
      <stop offset="100%" stop-color="#080B14" />
    </linearGradient>
    <linearGradient id="goldFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FF5E14" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="200" rx="16" fill="url(#lwBg)" />

  <!-- Iron Cage Grid (Free Fire Lone Wolf Arena) -->
  <g stroke="#FFB800" stroke-width="1" opacity="0.15">
    <line x1="80" y1="30" x2="80" y2="170" />
    <line x1="120" y1="30" x2="120" y2="170" />
    <line x1="160" y1="30" x2="160" y2="170" />
    <line x1="200" y1="30" x2="200" y2="170" />
    <line x1="240" y1="30" x2="240" y2="170" />
    <line x1="60" y1="60" x2="260" y2="60" />
    <line x1="60" y1="100" x2="260" y2="100" />
    <line x1="60" y1="140" x2="260" y2="140" />
  </g>

  <!-- Center Wolf Head Silhouette Badge -->
  <circle cx="160" cy="100" r="42" fill="#18131B" stroke="url(#goldFire)" stroke-width="3" />
  
  <!-- Stylized Wolf Emblem -->
  <path d="M140 120 L135 90 L148 72 L155 88 L160 82 L165 88 L172 72 L185 90 L180 120 L168 132 L160 125 L152 132 Z" 
        fill="#FF5E14" stroke="#FACC15" stroke-width="1.5" />
  <circle cx="150" cy="94" r="2.5" fill="#FFFFFF" />
  <circle cx="170" cy="94" r="2.5" fill="#FFFFFF" />

  <!-- Sniper Crosshair Ring -->
  <circle cx="160" cy="100" r="54" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.4" />

  <!-- Duel Swords / Gloo Wall Icon -->
  <rect x="142" y="146" width="36" height="12" rx="4" fill="#00F0FF" opacity="0.8" />
  <text x="160" y="155" fill="#000" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle">GLOO SKILL</text>

  <!-- Mode Header Tags -->
  <text x="20" y="32" fill="#FFB800" font-family="sans-serif" font-weight="900" font-size="11" letter-spacing="2">IRON CAGE 1v1 / 2v2</text>
  <text x="20" y="180" fill="#9CA3AF" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="1">PURE AIM • GLOO WALLS • HEADSHOTS ONLY</text>
</svg>