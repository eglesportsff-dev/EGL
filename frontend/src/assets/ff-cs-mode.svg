<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A1E" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E14" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="200" rx="16" fill="url(#csBg)" />

  <!-- Tactical Diagonal Stripes -->
  <line x1="0" y1="200" x2="200" y2="0" stroke="#00F0FF" stroke-width="1.5" opacity="0.1" />
  <line x1="60" y1="200" x2="260" y2="0" stroke="#00F0FF" stroke-width="1.5" opacity="0.1" />
  <line x1="120" y1="200" x2="320" y2="0" stroke="#00F0FF" stroke-width="1.5" opacity="0.1" />

  <!-- Center Arena Shield -->
  <polygon points="160,35 210,60 195,130 160,165 125,130 110,60" fill="#0C1324" stroke="url(#cyanGlow)" stroke-width="3" />

  <!-- 4 vs 4 VS Badge -->
  <!-- Left Side: Squad 1 (Cyan) -->
  <circle cx="100" cy="100" r="22" fill="#0E2338" stroke="#00F0FF" stroke-width="2.5" />
  <text x="100" y="106" fill="#00F0FF" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">4</text>
  <text x="100" y="134" fill="#67E8F9" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">BLUE</text>

  <!-- Center "VS" -->
  <text x="160" y="108" fill="#FFF" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" font-style="italic">VS</text>

  <!-- Right Side: Squad 2 (Orange) -->
  <circle cx="220" cy="100" r="22" fill="#2E120A" stroke="#FF5E14" stroke-width="2.5" />
  <text x="220" y="106" fill="#FF5E14" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">4</text>
  <text x="220" y="134" fill="#FCA5A5" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">RED</text>

  <!-- Crossed Swords / Guns Silhouette below -->
  <line x1="135" y1="145" x2="185" y2="145" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
  <circle cx="160" cy="145" r="4" fill="#FACC15" />

  <!-- Mode Header Tags -->
  <text x="20" y="32" fill="#00F0FF" font-family="sans-serif" font-weight="900" font-size="11" letter-spacing="2">TACTICAL 4v4 CLASH</text>
  <text x="20" y="180" fill="#9CA3AF" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="1">7 ROUNDS • BUY PHASE • FAST ACTION</text>
</svg>