<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="50%" stop-color="#FF5E14" />
      <stop offset="100%" stop-color="#E01B24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E14" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#FFB800" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF5E14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Glowing Aura Background -->
  <circle cx="100" cy="100" r="90" fill="url(#auraGlow)" />

  <!-- Outer Esports Shield -->
  <path d="M100 15 L165 42 L150 135 L100 185 L50 135 L35 42 Z" 
        fill="#0C101D" stroke="url(#fireGrad)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner Shield Trim -->
  <path d="M100 28 L152 50 L138 126 L100 168 L62 126 L48 50 Z" 
        fill="#141A2E" stroke="#FFB800" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Fire Flame Wings -->
  <path d="M100 45 C115 65 135 70 140 92 C145 112 130 130 118 138 C128 122 125 102 115 95 C112 110 102 120 100 132 C98 120 88 110 85 95 C75 102 72 122 82 138 C70 130 55 112 60 92 C65 70 85 65 100 45 Z" 
        fill="url(#fireGrad)" />

  <!-- Inner Fire Accent -->
  <path d="M100 68 C108 80 120 85 120 100 C120 115 110 125 100 130 C90 125 80 115 80 100 C80 85 92 80 100 68 Z" 
        fill="url(#goldGrad)" />

  <!-- Center Crosshair Reticle -->
  <circle cx="100" cy="105" r="16" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.9" />
  <circle cx="100" cy="105" r="5" fill="#FFFFFF" />
  <line x1="100" y1="84" x2="100" y2="92" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="118" x2="100" y2="126" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="79" y1="105" x2="87" y2="105" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="113" y1="105" x2="121" y2="105" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Booyah Star Badge at Bottom -->
  <polygon points="100,140 104,150 115,151 107,158 110,169 100,163 90,169 93,158 85,151 96,150" fill="#FFB800" stroke="#FFF" stroke-width="1" />
</svg>