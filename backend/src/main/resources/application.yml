server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/esports_tournament}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:smtp.resend.com}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${BREVO_USER:${SPRING_MAIL_USERNAME:}}}
    password: ${MAIL_PASSWORD:${RESEND_API_KEY:${BREVO_API_KEY:${SPRING_MAIL_PASSWORD:}}}}
    properties:
      mail:
        from: ${MAIL_FROM:${RESEND_FROM:${BREVO_SENDER_EMAIL:${MAIL_USERNAME:${ADMIN_EMAIL:eglesportsff@gmail.com}}}}}
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  debug-errors: ${DEBUG_ERRORS:false}

  mail:
    resend-api-key: ${RESEND_API_KEY:}
    resend-from: ${RESEND_FROM:}

  jwt:
    secret: ${JWT_SECRET:EliteGrindLeagueTournamentSecureJwtSecretKey2026SpringBootAuthenticationSystem}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}

  admin:
    email: ${ADMIN_EMAIL:lavkush01maurya@gmail.com}
    password: ${ADMIN_PASSWORD:Lav#2004}
    username: ${ADMIN_USERNAME:Lavkush}